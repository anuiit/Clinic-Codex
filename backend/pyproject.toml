[project]
name = "frontend-integration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "albumentations>=1.4,<2.0",
    "flask>=3.0,<4.0",
    "flask-cors>=4.0",
    "mobile-sam",
    "numpy>=1.24,<2.5",
    "pandas>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "segment-anything==1.0",
    "timm>=0.9",
    "torch>=2.1,<2.6",
    "torchvision>=0.16,<0.21",
    "tqdm>=4.66",
]

[tool.uv.sources]
mobile-sam = { git = "https://github.com/ChaoningZhang/MobileSAM.git" }
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
