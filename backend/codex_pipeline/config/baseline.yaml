# Reproducible pre-annotation baseline.  The runtime class order remains the
# order in backend/codex_model/config.json; sparse classes are retained for
# prototype export even when they cannot participate in every episode.
paths:
  elements_dir: "./Elements"
  metadata_csv: "./metadata.csv"
  checkpoint_dir: "./checkpoints"
  prototype_dir: "./prototypes"
data:
  image_size: 224
  min_images_per_class: 2
  val_fraction: 0.15
  split_strategy: "source_group"
  num_workers: 0
model:
  backbone: "dinov2_vits14"
  embedding_dim: 128
  freeze_blocks: 9
  pretrained: true
training:
  episodes_per_epoch: 500
  num_epochs: 100
  n_way: 20
  k_shot: 3
  q_queries: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_scheduler: "cosine"
  warmup_epochs: 5
  temperature: 0.1
  device: "cuda"
  seed: 42
evaluation:
  k_shot_values: [1, 3, 5]
  num_eval_episodes: 200
